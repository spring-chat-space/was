# ─── P6Spy SQL 로그 설정 ───
# SLF4J(Logback)으로 출력 — 프로파일별 logging.level.p6spy 로 ON/OFF 제어
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 실제 파라미터가 바인딩된 완성형 SQL 한 줄로 출력
# %(executionTime)ms | 실제 SQL (파라미터 치환 완료)
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms | %(sql)

# 0ms 이상 모든 쿼리 출력 (느린 쿼리만 보려면 예: 1000 으로 설정)
executionThreshold=0
