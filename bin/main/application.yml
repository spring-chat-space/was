spring:
  application:
    name: chat-was
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# p6spy SQL 로그: 기본값 off — local/dev 프로파일에서만 활성화
logging:
  level:
    p6spy: off

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

crypto:
  aes256:
    secret-key: ChatSiteAES256Key2024123456789AB
    iv: ChatSiteAESIV16B
