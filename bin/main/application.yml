spring:
  application:
    name: chat-was
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

crypto:
  aes256:
    secret-key: ChatSiteAES256Key2024123456789AB
    iv: ChatSiteAESIV16B
